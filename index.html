<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ESP8266 MQTT Test</title>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<style>

body {
    font-family: Arial;
    text-align: center;
    padding: 30px;
}

input {
    width: 80%;
    max-width: 500px;
    padding: 15px;
    font-size: 18px;
}

button {
    padding: 15px 25px;
    margin: 10px;
    font-size: 18px;
    cursor: pointer;
}

#status {
    margin: 20px;
    font-weight: bold;
}

</style>

</head>

<body>

<h2>ESP8266 MQTT TEST</h2>

<div id="status">
Connecting MQTT...
</div>

<input
    id="message"
    type="text"
    placeholder="Type message here"
>

<br>

<button onclick="sendMessage()">
SEND
</button>

<script>

const MQTT_URL = "ws://broker.hivemq.com:8000/mqtt";

const TOPIC =
    "english/trainer/esp8266_9A7C/text";

const clientID =
    "HTML_Test_" +
    Math.random().toString(16).substr(2, 8);

const client =
    mqtt.connect(MQTT_URL, {
        clientId: clientID
    });

const status =
    document.getElementById("status");


client.on("connect", function() {

    console.log("MQTT CONNECTED");

    status.innerHTML =
        "🟢 MQTT CONNECTED";

});


client.on("error", function(error) {

    console.log("MQTT ERROR:", error);

    status.innerHTML =
        "🔴 MQTT ERROR";

});


client.on("offline", function() {

    status.innerHTML =
        "🟠 MQTT OFFLINE";

});


function sendMessage() {

    const input =
        document.getElementById("message");

    const message =
        input.value.trim();

    if (message === "") {
        return;
    }

    client.publish(
        TOPIC,
        message
    );

    console.log(
        "Sent:",
        message
    );

    input.value = "";

}

</script>

</body>
</html>
