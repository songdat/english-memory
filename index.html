<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>English Memory Trainer</title>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<style>

body {
    font-family: Arial, sans-serif;
    background: #111827;
    color: white;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 500px;
    margin: auto;
    text-align: center;
}

h1 {
    margin-bottom: 30px;
}

input {
    width: 100%;
    box-sizing: border-box;
    padding: 15px;
    font-size: 18px;
    border: none;
    border-radius: 10px;
    margin-bottom: 15px;
}

button {
    width: 100%;
    padding: 15px;
    font-size: 18px;
    border: none;
    border-radius: 10px;
    margin-top: 10px;
    cursor: pointer;
}

.add {
    background: #22c55e;
    color: white;
}

.reset {
    background: #ef4444;
    color: white;
}

</style>

</head>


<body>


<div class="container">

<h1>English Memory Trainer</h1>


<input
    id="text"
    type="text"
    placeholder="Enter English sentence..."
>


<button
    class="add"
    onclick="addText()">

    เพิ่ม

</button>


<button
    class="reset"
    onclick="resetText()">

    รีเซ็ต

</button>


</div>


<script>


// =====================================================
// HIVEMQ CLOUD
// =====================================================

// ใส่ Cluster URL ของคุณ
const MQTT_HOST =
    "YOUR-CLUSTER.hivemq.cloud";


// HiveMQ Cloud WebSocket
const MQTT_PORT = 8884;


// MQTT Username
const MQTT_USERNAME =
    "YOUR_MQTT_USERNAME";


// MQTT Password
const MQTT_PASSWORD =
    "YOUR_MQTT_PASSWORD";


// =====================================================
// TOPICS
// =====================================================

const TEXT_TOPIC =
    "english/trainer/text";

const RESET_TOPIC =
    "english/trainer/reset";


// =====================================================
// CONNECT
// =====================================================

const client =
    mqtt.connect(
        "wss://" +
        MQTT_HOST +
        ":" +
        MQTT_PORT +
        "/mqtt",
        {

            username:
                MQTT_USERNAME,

            password:
                MQTT_PASSWORD,

            clientId:
                "EnglishTrainerWeb_" +
                Math.random()
                .toString(16)
                .substring(2)

        }
    );


// =====================================================
// CONNECTED
// =====================================================

client.on(
    "connect",
    function() {

        console.log(
            "MQTT CONNECTED"
        );

    }
);


// =====================================================
// ERROR
// =====================================================

client.on(
    "error",
    function(error) {

        console.log(
            "MQTT ERROR",
            error
        );

    }
);


// =====================================================
// ADD TEXT
// =====================================================

function addText() {

    let text =
        document
        .getElementById("text")
        .value
        .trim();


    if (
        text === ""
    ) {

        return;

    }


    if (
        !client.connected
    ) {

        alert(
            "MQTT is not connected."
        );

        return;

    }


    client.publish(
        TEXT_TOPIC,
        text
    );


    document
    .getElementById("text")
    .value = "";

}


// =====================================================
// RESET
// =====================================================

function resetText() {

    if (
        !client.connected
    ) {

        alert(
            "MQTT is not connected."
        );

        return;

    }


    client.publish(
        RESET_TOPIC,
        "RESET"
    );


    document
    .getElementById("text")
    .value = "";

}


// =====================================================
// ENTER KEY
// =====================================================

document
.getElementById("text")
.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            addText();

        }

    }
);


</script>


</body>

</html>
