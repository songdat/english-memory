<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>English Memory Trainer</title>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<style>

body {
    font-family: Arial, sans-serif;
    background: #111827;
    color: white;
    text-align: center;
    padding: 30px;
}

.container {
    max-width: 600px;
    margin: auto;
}

h1 {
    margin-bottom: 10px;
}

#status {
    padding: 12px;
    margin: 20px 0;
    border-radius: 8px;
    background: #374151;
}

/* =================================
   TEXTAREA
================================= */

textarea {
    width: 100%;
    height: 140px;
    box-sizing: border-box;
    padding: 15px;
    font-size: 18px;
    border-radius: 8px;
    border: none;
    resize: vertical;
    font-family: Arial, sans-serif;
}

/* =================================
   OLED PREVIEW
================================= */

.preview-title {
    margin-top: 25px;
    margin-bottom: 8px;
    font-size: 18px;
    font-weight: bold;
}

.preview-info {
    font-size: 14px;
    color: #9ca3af;
    margin-bottom: 10px;
}

#oledPreview {
    width: 100%;
    max-width: 420px;
    margin: auto;
    padding: 15px;
    box-sizing: border-box;

    background: #000000;
    border: 3px solid #4b5563;
    border-radius: 10px;

    text-align: left;

    font-family: monospace;
    font-size: 16px;
    line-height: 1.4;

    color: #ffffff;

    white-space: pre;
    overflow-x: auto;
}

/* =================================
   COUNTER
================================= */

#counter {
    margin-top: 8px;
    font-size: 14px;
    color: #9ca3af;
}

/* =================================
   BUTTON
================================= */

button {
    padding: 14px 25px;
    margin: 12px 5px;
    font-size: 17px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

#addBtn {
    background: #22c55e;
    color: white;
}

#resetBtn {
    background: #ef4444;
    color: white;
}

button:hover {
    opacity: 0.85;
}

/* =================================
   LOG
================================= */

#log {
    margin-top: 20px;
    text-align: left;
    background: #1f2937;
    padding: 15px;
    border-radius: 8px;
    min-height: 80px;
    white-space: pre-wrap;
}

</style>

</head>

<body>

<div class="container">

<h1>English Memory Trainer</h1>

<div id="status">
🟠 Connecting MQTT...
</div>


<!-- =================================
     TEXT INPUT
================================= -->

<textarea
    id="message"
    placeholder="Type English sentences here...

Press ENTER for a new line.
Press CTRL + ENTER to send."
></textarea>


<!-- =================================
     OLED PREVIEW
================================= -->

<div class="preview-title">
    OLED PREVIEW
</div>

<div class="preview-info">
    21 characters × 4 lines
</div>

<div id="oledPreview">
                     
                     
                     
                     
</div>

<div id="counter">
    Characters: 0 | Lines: 0
</div>


<!-- =================================
     BUTTONS
================================= -->

<button id="addBtn" onclick="sendMessage()">
ADD TEXT
</button>

<button id="resetBtn" onclick="resetText()">
RESET
</button>


<!-- =================================
     LOG
================================= -->

<div id="log">
Waiting...
</div>

</div>


<script>

/* =================================
   MQTT SETTINGS
================================= */

const MQTT_URL =
    "wss://broker.hivemq.com:8884/mqtt";

const TEXT_TOPIC =
    "english/trainer/esp8266_9A7C/text";

const RESET_TOPIC =
    "english/trainer/esp8266_9A7C/reset";


/* =================================
   MQTT CLIENT
================================= */

const clientID =
    "EnglishHTML_" +
    Math.random()
        .toString(16)
        .substring(2, 10);

const client = mqtt.connect(MQTT_URL, {

    clientId: clientID,

    clean: true,

    connectTimeout: 10000,

    reconnectPeriod: 3000

});


/* =================================
   ELEMENTS
================================= */

const status =
    document.getElementById("status");

const log =
    document.getElementById("log");

const textarea =
    document.getElementById("message");

const oledPreview =
    document.getElementById("oledPreview");

const counter =
    document.getElementById("counter");


/* =================================
   OLED SETTINGS
================================= */

const OLED_CHARS = 21;
const OLED_LINES = 4;


/* =================================
   OLED PREVIEW
================================= */

function updateOLEDPreview() {

    const text =
        textarea.value;

    let lines = [];

    /*
       Process each manually entered line
    */

    const inputLines =
        text.split("\n");


    inputLines.forEach(function(line) {

        /*
           Wrap every 21 characters
        */

        if (line.length === 0) {

            lines.push("");

            return;
        }


        for (
            let i = 0;
            i < line.length;
            i += OLED_CHARS
        ) {

            lines.push(
                line.substring(
                    i,
                    i + OLED_CHARS
                )
            );

        }

    });


    /*
       Show only the first 4 lines
       as an OLED preview
    */

    let preview = "";

    for (
        let i = 0;
        i < OLED_LINES;
        i++
    ) {

        if (lines[i]) {

            preview +=
                lines[i].padEnd(
                    OLED_CHARS,
                    " "
                );

        } else {

            preview +=
                " ".repeat(
                    OLED_CHARS
                );

        }


        if (i < OLED_LINES - 1) {

            preview += "\n";

        }

    }


    oledPreview.textContent =
        preview;


    /*
       Counter
    */

    counter.textContent =
        "Characters: " +
        text.length +
        " | Lines: " +
        lines.length;

}


/* =================================
   UPDATE PREVIEW WHILE TYPING
================================= */

textarea.addEventListener(
    "input",
    updateOLEDPreview
);


/* =================================
   MQTT STATUS
================================= */

client.on("connect", function() {

    status.innerHTML =
        "🟢 MQTT CONNECTED";

    log.innerHTML =
        "Connected to MQTT broker.";

    console.log("MQTT CONNECTED");

});


client.on("reconnect", function() {

    status.innerHTML =
        "🟠 MQTT RECONNECTING...";

});


client.on("offline", function() {

    status.innerHTML =
        "🔴 MQTT OFFLINE";

});


client.on("error", function(error) {

    console.log(
        "MQTT ERROR:",
        error
    );

    status.innerHTML =
        "🔴 MQTT ERROR";

    log.innerHTML =
        "MQTT Error: " +
        error.message;

});


/* =================================
   SEND TEXT
================================= */

function sendMessage() {

    const message =
        textarea.value.trim();


    if (message === "") {

        alert(
            "Please enter some text."
        );

        return;
    }


    if (!client.connected) {

        alert(
            "MQTT is not connected yet."
        );

        return;
    }


    client.publish(
        TEXT_TOPIC,
        message
    );


    log.innerHTML =
        "Sent to ESP8266:\n\n" +
        message;


    textarea.value = "";

    updateOLEDPreview();

}


/* =================================
   RESET
================================= */

function resetText() {

    if (!client.connected) {

        alert(
            "MQTT is not connected yet."
        );

        return;
    }


    client.publish(
        RESET_TOPIC,
        "RESET"
    );


    log.innerHTML =
        "RESET sent to ESP8266.";

}


/* =================================
   KEYBOARD CONTROL
================================= */

/*
   ENTER
   = New line

   CTRL + ENTER
   = Send message
*/

textarea.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            event.ctrlKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =================================
   INITIAL PREVIEW
================================= */

updateOLEDPreview();

</script>

</body>

</html>
