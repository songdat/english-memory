<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>English Memory Trainer</title>


<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>


<style>

body {

    font-family: Arial, sans-serif;

    background: #111827;

    color: white;

    margin: 0;

    padding: 20px;

}


.container {

    max-width: 500px;

    margin: auto;

    text-align: center;

}


h1 {

    margin-bottom: 25px;

}


input {

    width: 100%;

    box-sizing: border-box;

    padding: 15px;

    font-size: 18px;

    border: none;

    border-radius: 10px;

    margin-bottom: 15px;

}


button {

    width: 100%;

    padding: 15px;

    font-size: 18px;

    border: none;

    border-radius: 10px;

    margin-top: 10px;

    cursor: pointer;

}


.add {

    background: #22c55e;

    color: white;

}


.reset {

    background: #ef4444;

    color: white;

}


#status {

    margin-top: 20px;

    font-size: 15px;

}


</style>

</head>


<body>


<div class="container">


<h1>
English Memory Trainer
</h1>


<input
    id="text"
    type="text"
    placeholder="Enter English sentence..."
>


<button
    class="add"
    onclick="addText()">

    เพิ่ม

</button>


<button
    class="reset"
    onclick="resetText()">

    รีเซ็ต

</button>


<div id="status">
    Connecting MQTT...
</div>


</div>


<script>


// =====================================================
// MQTT BROKER
// =====================================================

// HiveMQ Public Broker
//
// Browser ใช้ WebSocket
//
// ws://broker.hivemq.com:8000/mqtt

const MQTT_URL =
    "ws://broker.hivemq.com:8000/mqtt";


// =====================================================
// MQTT TOPICS
// =====================================================

const TEXT_TOPIC =
    "english/trainer/esp8266_9A7C/text";

const RESET_TOPIC =
    "english/trainer/esp8266_9A7C/reset";


// =====================================================
// MQTT CLIENT
// =====================================================

const client =
    mqtt.connect(
        MQTT_URL,
        {

            clientId:
                "EnglishTrainerWeb_" +
                Math.random()
                .toString(16)
                .substring(2),

            clean: true,

            connectTimeout:
                10000,

            reconnectPeriod:
                3000

        }
    );


// =====================================================
// STATUS ELEMENT
// =====================================================

const status =
    document.getElementById(
        "status"
    );


// =====================================================
// CONNECT
// =====================================================

client.on(
    "connect",
    function() {

        console.log(
            "MQTT CONNECTED"
        );


        status.innerHTML =
            "● MQTT Connected";

    }
);


// =====================================================
// RECONNECT
// =====================================================

client.on(
    "reconnect",
    function() {

        status.innerHTML =
            "● Reconnecting...";

    }
);


// =====================================================
// OFFLINE
// =====================================================

client.on(
    "offline",
    function() {

        status.innerHTML =
            "● MQTT Offline";

    }
);


// =====================================================
// ERROR
// =====================================================

client.on(
    "error",
    function(error) {

        console.log(
            "MQTT ERROR:",
            error
        );


        status.innerHTML =
            "● MQTT Error";

    }
);


// =====================================================
// ADD TEXT
// =====================================================

function addText() {


    const input =
        document.getElementById(
            "text"
        );


    const text =
        input.value.trim();


    if (
        text === ""
    ) {

        return;

    }


    if (
        !client.connected
    ) {

        alert(
            "MQTT is not connected."
        );

        return;

    }


    client.publish(
        TEXT_TOPIC,
        text
    );


    console.log(
        "SEND:",
        text
    );


    input.value = "";


}


// =====================================================
// RESET
// =====================================================

function resetText() {


    if (
        !client.connected
    ) {

        alert(
            "MQTT is not connected."
        );

        return;

    }


    client.publish(
        RESET_TOPIC,
        "RESET"
    );


    console.log(
        "RESET"
    );


}


// =====================================================
// ENTER KEY
// =====================================================

document
.getElementById("text")
.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            addText();

        }

    }
);


</script>


</body>

</html>
