<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>English Memory Trainer</title>

<style>

body {
    font-family: Arial, sans-serif;
    background: #111827;
    color: white;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 600px;
    margin: auto;
}

h1 {
    text-align: center;
}

.card {
    background: #1f2937;
    padding: 20px;
    border-radius: 15px;
    margin-top: 20px;
}

input {
    width: 100%;
    box-sizing: border-box;
    padding: 14px;
    font-size: 18px;
    border-radius: 8px;
    border: none;
    margin-bottom: 10px;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 8px;
    border: none;
    border-radius: 8px;
    font-size: 17px;
    cursor: pointer;
}

.add {
    background: #22c55e;
    color: white;
}

.reset {
    background: #ef4444;
    color: white;
}

.connect {
    background: #3b82f6;
    color: white;
}

.status {
    background: #374151;
    padding: 15px;
    border-radius: 10px;
    margin-top: 15px;
}

.success {
    color: #4ade80;
}

.error {
    color: #f87171;
}

.message {
    background: #111827;
    padding: 12px;
    border-radius: 8px;
    margin-top: 8px;
    word-wrap: break-word;
}

.ip {
    font-size: 14px;
    color: #9ca3af;
    margin-top: 8px;
}

</style>

</head>


<body>

<div class="container">

<h1>English Memory Trainer</h1>


<!-- ========================================= -->
<!-- CONNECTION -->
<!-- ========================================= -->

<div class="card">

<h2>ESP8266 Connection</h2>

<input
    id="espIP"
    type="text"
    value="192.168.9.10"
    placeholder="ESP8266 IP Address"
>

<button
    class="connect"
    onclick="checkConnection()">

    Connect to ESP8266

</button>

<div class="status">

Status:

<span id="connection">
Not connected
</span>

</div>

<div class="ip">

Example: 192.168.9.10

</div>

</div>


<!-- ========================================= -->
<!-- SEND SENTENCE -->
<!-- ========================================= -->

<div class="card">

<h2>Send English Sentence</h2>

<input
    id="sentence"
    type="text"
    placeholder="Enter English sentence..."
>

<button
    class="add"
    onclick="sendMessage()">

    เพิ่มเข้า OLED

</button>

<button
    class="reset"
    onclick="resetMessage()">

    รีเซ็ต

</button>

</div>


<!-- ========================================= -->
<!-- STATUS -->
<!-- ========================================= -->

<div class="card">

<h2>ESP8266 Status</h2>

<div class="status">

<div>

Connection:

<span id="statusConnection">
-

</span>

</div>


<div class="message">

Last message received:

<br>

<strong id="lastMessage">

-

</strong>

</div>


<div class="message">

Received time:

<br>

<strong id="receivedTime">

-

</strong>

</div>

</div>

</div>

</div>


<script>


// =====================================================
// ESP8266 IP
// =====================================================

function getESPIP() {

    let ip =
        document.getElementById("espIP").value.trim();

    return ip;

}


// =====================================================
// CHECK CONNECTION
// =====================================================

function checkConnection() {

    let ip = getESPIP();


    if (ip === "") {

        alert("Please enter ESP8266 IP address.");

        return;

    }


    document.getElementById(
        "connection"
    ).innerHTML = "Connecting...";


    fetch(
        "http://" + ip + "/status"
    )

    .then(response => {

        if (!response.ok) {

            throw new Error(
                "ESP8266 response error"
            );

        }

        return response.json();

    })

    .then(data => {

        document.getElementById(
            "connection"
        ).innerHTML =
            "<span class='success'>CONNECTED</span>";


        updateStatus(data);

    })

    .catch(error => {

        document.getElementById(
            "connection"
        ).innerHTML =
            "<span class='error'>DISCONNECTED</span>";

        console.log(error);

    });

}


// =====================================================
// UPDATE STATUS
// =====================================================

function updateStatus(data) {

    document.getElementById(
        "statusConnection"
    ).innerHTML =
        "<span class='success'>CONNECTED</span>";


    document.getElementById(
        "lastMessage"
    ).innerText =
        data.message || "-";


    document.getElementById(
        "receivedTime"
    ).innerText =
        data.time || "-";

}


// =====================================================
// SEND MESSAGE
// =====================================================

function sendMessage() {

    let ip = getESPIP();

    let text =
        document.getElementById(
            "sentence"
        ).value.trim();


    if (ip === "") {

        alert(
            "Please enter ESP8266 IP address."
        );

        return;

    }


    if (text === "") {

        alert(
            "Please enter an English sentence."
        );

        return;

    }


    document.getElementById(
        "statusConnection"
    ).innerText =
        "Sending...";


    fetch(
        "http://" +
        ip +
        "/add?text=" +
        encodeURIComponent(text)
    )

    .then(response => {

        if (!response.ok) {

            throw new Error(
                "ESP8266 response error"
            );

        }

        return response.json();

    })

    .then(data => {

        if (data.success) {

            document.getElementById(
                "sentence"
            ).value = "";


            document.getElementById(
                "statusConnection"
            ).innerHTML =
                "<span class='success'>MESSAGE SENT</span>";


            checkConnection();

        }

        else {

            document.getElementById(
                "statusConnection"
            ).innerHTML =
                "<span class='error'>SEND FAILED</span>";

        }

    })

    .catch(error => {

        document.getElementById(
            "statusConnection"
        ).innerHTML =
            "<span class='error'>ESP8266 NOT FOUND</span>";


        console.log(error);

        alert(
            "Cannot connect to ESP8266."
        );

    });

}


// =====================================================
// RESET
// =====================================================

function resetMessage() {

    let ip = getESPIP();


    if (ip === "") {

        alert(
            "Please enter ESP8266 IP address."
        );

        return;

    }


    fetch(
        "http://" +
        ip +
        "/reset"
    )

    .then(response => response.json())

    .then(data => {

        if (data.success) {

            document.getElementById(
                "lastMessage"
            ).innerText = "-";


            document.getElementById(
                "receivedTime"
            ).innerText = "-";


            document.getElementById(
                "statusConnection"
            ).innerHTML =
                "<span class='success'>RESET OK</span>";

        }

    })

    .catch(error => {

        document.getElementById(
            "statusConnection"
        ).innerHTML =
            "<span class='error'>RESET FAILED</span>";

    });

}


// =====================================================
// ENTER KEY
// =====================================================

document
.getElementById("sentence")
.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            sendMessage();

        }

    }
);


// =====================================================
// AUTO CHECK
// =====================================================

setInterval(
    function() {

        checkConnection();

    },
    5000
);

</script>


</body>

</html>
