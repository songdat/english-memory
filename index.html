<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>English Memory Trainer V4</title>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<style>

body {

    font-family: Arial, sans-serif;

    background: #111827;

    color: white;

    text-align: center;

    padding: 30px;

}

.container {

    max-width: 600px;

    margin: auto;

}

h1 {

    margin-bottom: 10px;

}

#status {

    padding: 12px;

    margin: 20px 0;

    border-radius: 8px;

    background: #374151;

}

/* ============================= */
/* TEXT AREA */
/* ============================= */

textarea {

    width: 21ch;

    height: 400px;

    box-sizing: border-box;

    padding: 12px;

    font-family: monospace;

    font-size: 18px;

    line-height: 1.6;

    border-radius: 8px;

    border: none;

    resize: vertical;

    white-space: pre-wrap;

    overflow-wrap: break-word;

    word-break: break-all;

    display: block;

    margin: 0 auto;

}

/* ============================= */
/* COUNTER */
/* ============================= */

#counter {

    margin-top: 8px;

    font-family: monospace;

    font-size: 14px;

    color: #9ca3af;

}

/* ============================= */
/* BUTTON */
/* ============================= */

button {

    padding: 14px 25px;

    margin: 12px 5px;

    font-size: 17px;

    border: none;

    border-radius: 8px;

    cursor: pointer;

}

#addBtn {

    background: #22c55e;

    color: white;

}

#resetBtn {

    background: #ef4444;

    color: white;

}

/* ============================= */
/* LOG */
/* ============================= */

#log {

    margin-top: 20px;

    text-align: left;

    background: #1f2937;

    padding: 15px;

    border-radius: 8px;

    min-height: 80px;

    white-space: pre-wrap;

    font-family: monospace;

}

.help {

    margin-top: 15px;

    color: #9ca3af;

    font-size: 14px;

}

</style>

</head>


<body>


<div class="container">


<h1>English Memory Trainer V4</h1>


<div id="status">

🟠 Connecting MQTT...

</div>


<textarea
    id="message"
    placeholder="Type English sentences here..."
    wrap="soft"></textarea>


<div id="counter">

0 characters | 1 line

</div>


<br>


<button id="addBtn"
        onclick="sendMessage()">

ADD TEXT

</button>


<button id="resetBtn"
        onclick="resetText()">

RESET

</button>


<div class="help">

Press <b>Enter</b> for a new line.<br>

Press <b>Enter twice</b> to create a blank line.<br>

Press <b>Ctrl + Enter</b> to send.

</div>


<div id="log">

Waiting...

</div>


</div>


<script>


// =====================================================
// MQTT SETTINGS
// =====================================================

const MQTT_URL =
    "wss://broker.hivemq.com:8884/mqtt";


const TEXT_TOPIC =
    "english/trainer/esp8266_9A7C/text";


const RESET_TOPIC =
    "english/trainer/esp8266_9A7C/reset";


// =====================================================
// MQTT CLIENT ID
// =====================================================

const clientID =
    "EnglishHTML_" +
    Math.random()
    .toString(16)
    .substring(2, 10);


// =====================================================
// MQTT CONNECT
// =====================================================

const client = mqtt.connect(
    MQTT_URL,
    {

        clientId: clientID,

        clean: true,

        connectTimeout: 10000,

        reconnectPeriod: 3000

    }
);


// =====================================================
// HTML ELEMENTS
// =====================================================

const status =
    document.getElementById("status");


const log =
    document.getElementById("log");


const textarea =
    document.getElementById("message");


const counter =
    document.getElementById("counter");


// =====================================================
// MQTT CONNECTED
// =====================================================

client.on("connect", function() {

    status.innerHTML =
        "🟢 MQTT CONNECTED";

    log.textContent =
        "Connected to MQTT broker.";

    console.log("MQTT CONNECTED");

});


// =====================================================
// MQTT RECONNECT
// =====================================================

client.on("reconnect", function() {

    status.innerHTML =
        "🟠 MQTT RECONNECTING...";

});


// =====================================================
// MQTT OFFLINE
// =====================================================

client.on("offline", function() {

    status.innerHTML =
        "🔴 MQTT OFFLINE";

});


// =====================================================
// MQTT ERROR
// =====================================================

client.on("error", function(error) {

    console.log(
        "MQTT ERROR:",
        error
    );

    status.innerHTML =
        "🔴 MQTT ERROR";

    log.textContent =
        "MQTT Error: " +
        error.message;

});


// =====================================================
// UPDATE CHARACTER / LINE COUNTER
// =====================================================

function updateCounter() {

    const text =
        textarea.value;


    const characters =
        text.length;


    const lines =
        text.split("\n").length;


    counter.textContent =
        characters +
        " characters | " +
        lines +
        " lines";

}


// =====================================================
// SEND TEXT
// =====================================================

function sendMessage() {

    /*
       IMPORTANT:

       Do NOT use:

       textarea.value.trim()

       because trim() removes
       whitespace and Enter characters
       at the beginning/end.

       We keep the original text.
    */

    const message =
        textarea.value;


    // Check if there is actually text
    if (message.trim() === "") {

        alert(
            "Please enter some text."
        );

        return;

    }


    // Check MQTT connection

    if (!client.connected) {

        alert(
            "MQTT is not connected yet."
        );

        return;

    }


    // Send EXACT textarea content

    client.publish(
        TEXT_TOPIC,
        message
    );


    // Show sent text

    log.textContent =
        "Sent to ESP8266:\n\n" +
        message;


    // Clear textarea

    textarea.value = "";


    // Update counter

    updateCounter();

}


// =====================================================
// RESET
// =====================================================

function resetText() {

    if (!client.connected) {

        alert(
            "MQTT is not connected yet."
        );

        return;

    }


    const confirmReset =
        confirm(
            "Are you sure you want to reset all saved text?"
        );


    if (!confirmReset) {

        return;

    }


    client.publish(
        RESET_TOPIC,
        "RESET"
    );


    log.textContent =
        "RESET sent to ESP8266.";


}


// =====================================================
// TEXTAREA INPUT
// =====================================================

textarea.addEventListener(
    "input",
    function() {

        updateCounter();

    }
);


// =====================================================
// ENTER / CTRL + ENTER
// =====================================================

textarea.addEventListener(
    "keydown",
    function(event) {

        /*
           Normal Enter:

           Create a real new line.

           We DO NOT preventDefault().
        */


        if (
            event.key === "Enter" &&
            event.ctrlKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


// =====================================================
// INITIAL COUNTER
// =====================================================

updateCounter();


</script>


</body>

</html>
