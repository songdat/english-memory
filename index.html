<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>English Memory Trainer</title>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<style>

/* =================================
   BODY
================================= */

body {

    font-family: Arial, sans-serif;

    background: #111827;

    color: white;

    text-align: center;

    padding: 20px;

}


/* =================================
   CONTAINER
================================= */

.container {

    max-width: 700px;

    margin: auto;

}


/* =================================
   TITLE
================================= */

h1 {

    margin-bottom: 10px;

}


/* =================================
   STATUS
================================= */

#status {

    padding: 12px;

    margin: 20px 0;

    border-radius: 8px;

    background: #374151;

}


/* =================================
   TEXT AREA
================================= */

textarea {

    width: 100%;

    height: 360px;

    box-sizing: border-box;

    padding: 12px;

    font-family: monospace;

    font-size: 18px;

    line-height: 1.6;

    border-radius: 8px;

    border: 2px solid #4b5563;

    background: #000000;

    color: #ffffff;

    resize: vertical;

    outline: none;

}


/* =================================
   TEXT AREA FOCUS
================================= */

textarea:focus {

    border-color: #22c55e;

}


/* =================================
   CHARACTER GUIDE
================================= */

.guide {

    margin-top: 8px;

    font-size: 14px;

    color: #9ca3af;

}


/* =================================
   COUNTER
================================= */

#counter {

    margin-top: 8px;

    font-size: 14px;

    color: #9ca3af;

}


/* =================================
   BUTTON
================================= */

button {

    padding: 14px 25px;

    margin: 12px 5px;

    font-size: 17px;

    border: none;

    border-radius: 8px;

    cursor: pointer;

}


#addBtn {

    background: #22c55e;

    color: white;

}


#resetBtn {

    background: #ef4444;

    color: white;

}


button:hover {

    opacity: 0.85;

}


/* =================================
   LOG
================================= */

#log {

    margin-top: 20px;

    text-align: left;

    background: #1f2937;

    padding: 15px;

    border-radius: 8px;

    min-height: 80px;

    white-space: pre-wrap;

}


/* =================================
   MOBILE
================================= */

@media (max-width: 600px) {

    body {

        padding: 12px;

    }

    textarea {

        height: 400px;

        font-size: 17px;

    }

}

</style>

</head>


<body>


<div class="container">


<h1>
English Memory Trainer
</h1>


<div id="status">
🟠 Connecting MQTT...
</div>


<!-- =================================
     SINGLE TEXT BOX
================================= -->

<textarea
    id="message"
    placeholder="Type English here...

Use ENTER to start a new line.

Try to keep each line around
21 characters for the OLED."
></textarea>


<div class="guide">

OLED line width: approximately 21 characters

</div>


<div id="counter">

Characters: 0 | Lines: 0

</div>


<br>


<!-- =================================
     BUTTONS
================================= -->

<button
    id="addBtn"
    onclick="sendMessage()">

ADD TEXT

</button>


<button
    id="resetBtn"
    onclick="resetText()">

RESET

</button>


<!-- =================================
     LOG
================================= -->

<div id="log">

Waiting...

</div>


</div>


<script>


/* =================================
   MQTT SETTINGS
================================= */

const MQTT_URL =
    "wss://broker.hivemq.com:8884/mqtt";


const TEXT_TOPIC =
    "english/trainer/esp8266_9A7C/text";


const RESET_TOPIC =
    "english/trainer/esp8266_9A7C/reset";


/* =================================
   MQTT CLIENT
================================= */

const clientID =

    "EnglishHTML_" +

    Math.random()

        .toString(16)

        .substring(2, 10);


const client =

    mqtt.connect(

        MQTT_URL,

        {

            clientId: clientID,

            clean: true,

            connectTimeout: 10000,

            reconnectPeriod: 3000

        }

    );


/* =================================
   ELEMENTS
================================= */

const status =

    document.getElementById(
        "status"
    );


const log =

    document.getElementById(
        "log"
    );


const textarea =

    document.getElementById(
        "message"
    );


const counter =

    document.getElementById(
        "counter"
    );


/* =================================
   UPDATE COUNTER
================================= */

function updateCounter() {


    const text =

        textarea.value;


    const lines =

        text === ""

            ? 0

            : text.split("\n").length;


    counter.textContent =

        "Characters: " +

        text.length +

        " | Lines: " +

        lines;


}


/* =================================
   UPDATE WHILE TYPING
================================= */

textarea.addEventListener(

    "input",

    updateCounter

);


/* =================================
   MQTT CONNECT
================================= */

client.on(

    "connect",

    function() {


        status.innerHTML =

            "🟢 MQTT CONNECTED";


        log.innerHTML =

            "Connected to MQTT broker.";


        console.log(
            "MQTT CONNECTED"
        );


    }

);


/* =================================
   MQTT RECONNECT
================================= */

client.on(

    "reconnect",

    function() {


        status.innerHTML =

            "🟠 MQTT RECONNECTING...";


    }

);


/* =================================
   MQTT OFFLINE
================================= */

client.on(

    "offline",

    function() {


        status.innerHTML =

            "🔴 MQTT OFFLINE";


    }

);


/* =================================
   MQTT ERROR
================================= */

client.on(

    "error",

    function(error) {


        console.log(

            "MQTT ERROR:",

            error

        );


        status.innerHTML =

            "🔴 MQTT ERROR";


        log.innerHTML =

            "MQTT Error: " +

            error.message;


    }

);


/* =================================
   SEND TEXT
================================= */

function sendMessage() {


    const message =

        textarea.value.trim();


    if (message === "") {


        alert(

            "Please enter some text."

        );


        return;

    }


    if (!client.connected) {


        alert(

            "MQTT is not connected yet."

        );


        return;

    }


    client.publish(

        TEXT_TOPIC,

        message

    );


    log.innerHTML =

        "Sent to ESP8266:\n\n" +

        message;


    textarea.value = "";


    updateCounter();


}


/* =================================
   RESET
================================= */

function resetText() {


    if (!client.connected) {


        alert(

            "MQTT is not connected yet."

        );


        return;

    }


    client.publish(

        RESET_TOPIC,

        "RESET"

    );


    log.innerHTML =

        "RESET sent to ESP8266.";


}


/* =================================
   KEYBOARD
================================= */

/*

ENTER
= New line

CTRL + ENTER
= Send message

*/

textarea.addEventListener(

    "keydown",

    function(event) {


        if (

            event.key === "Enter" &&

            event.ctrlKey

        ) {


            event.preventDefault();


            sendMessage();


        }


    }

);


/* =================================
   INITIAL COUNTER
================================= */

updateCounter();


</script>


</body>

</html>
