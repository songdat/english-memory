<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>English Memory Trainer</title>

<style>

body {
    font-family: Arial, sans-serif;
    background: #111827;
    color: white;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 500px;
    margin: auto;
    text-align: center;
}

h1 {
    margin-bottom: 30px;
}

input {
    width: 100%;
    box-sizing: border-box;

    padding: 15px;

    font-size: 18px;

    border: none;
    border-radius: 10px;

    margin-bottom: 15px;
}

button {
    width: 100%;

    padding: 15px;

    font-size: 18px;

    border: none;
    border-radius: 10px;

    margin-top: 10px;

    cursor: pointer;
}

.add {
    background: #22c55e;
    color: white;
}

.reset {
    background: #ef4444;
    color: white;
}

button:active {
    transform: scale(0.98);
}

</style>

</head>


<body>


<div class="container">

<h1>English Memory Trainer</h1>


<input
    id="text"
    type="text"
    placeholder="Enter English sentence..."
>


<button
    class="add"
    onclick="addText()">

    เพิ่ม

</button>


<button
    class="reset"
    onclick="resetText()">

    รีเซ็ต

</button>


</div>


<script>


// ESP8266 IP
const ESP8266 =
    "http://192.168.9.10";


// ==========================================
// เพิ่มข้อความ
// ==========================================

function addText() {

    let text =
        document
        .getElementById("text")
        .value
        .trim();


    if (text === "") {

        return;

    }


    fetch(
        ESP8266 +
        "/add?text=" +
        encodeURIComponent(text)
    )

    .then(
        response =>
        response.json()
    )

    .then(
        data => {

            if (data.success) {

                document
                .getElementById("text")
                .value = "";

            }

        }
    )

    .catch(
        error => {

            console.log(error);

        }
    );

}


// ==========================================
// รีเซ็ต
// ==========================================

function resetText() {

    fetch(
        ESP8266 +
        "/reset"
    )

    .then(
        response =>
        response.json()
    )

    .then(
        data => {

            if (data.success) {

                document
                .getElementById("text")
                .value = "";

            }

        }
    )

    .catch(
        error => {

            console.log(error);

        }
    );

}


// ==========================================
// กด Enter เพื่อเพิ่ม
// ==========================================

document
.getElementById("text")
.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            addText();

        }

    }
);


</script>


</body>

</html>
